name: Upload existing pinned Sail Lean source checkpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated source branch
        uses: actions/checkout@v5
        with:
          ref: sail-v044-source-20260823
      - name: Validate source archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c sail-riscv-H-Lean-ac2a585-source-default.tar.zst.sha256
          tar --zstd -tf sail-riscv-H-Lean-ac2a585-source-default.tar.zst >/dev/null
      - name: Upload existing source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: sail-riscv-H-Lean-ac2a585-existing-source
          path: |
            sail-riscv-H-Lean-ac2a585-source-default.tar.zst
            sail-riscv-H-Lean-ac2a585-source-default.tar.zst.sha256
            UPSTREAM-PIN.txt
          retention-days: 1
          compression-level: 0
